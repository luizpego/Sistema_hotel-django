name: Testes Django
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python manage.py collectstatic --noinput
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hotel
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: ci-temporaria
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENGINE: postgresql
      DB_NAME: hotel
      DB_USER: hotel
      DB_PASSWORD: ci-temporaria
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput
      - name: Verificar configuração de produção
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: 'false'
          SECRET_KEY: ci-chave-descartavel-nao-usar-em-producao-173846581946518746519
          ALLOWED_HOSTS: hotel.example.com
