services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - hotel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_NAME: hotel
      DB_USER: hotel
      DB_HOST: db
      DB_PORT: '5432'
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && waitress-serve --listen=0.0.0.0:8000 --threads=8 config.wsgi:application"
volumes:
  hotel-db:
