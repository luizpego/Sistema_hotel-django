{% if page_obj.has_other_pages %}<nav class="pagination-bar" aria-label="Páginas da lista">
{% if page_obj.has_previous %}<a class="btn btn-outline-secondary" href="?page={{ page_obj.previous_page_number }}&q={{ query|urlencode }}&status={{ status|urlencode }}&start={{ start|date:'Y-m-d' }}&end={{ end|date:'Y-m-d' }}">Anterior</a>{% endif %}
<span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="?page={{ page_obj.next_page_number }}&q={{ query|urlencode }}&status={{ status|urlencode }}&start={{ start|date:'Y-m-d' }}&end={{ end|date:'Y-m-d' }}">Próxima</a>{% endif %}</nav>{% endif %}
